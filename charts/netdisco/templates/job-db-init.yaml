apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "netdisco.fullname" . }}-db-init
  labels:
    {{- include "netdisco.labels" . | nindent 4 }}
  annotations:
    # post-install: on a fresh install the chart's own ServiceAccount/
    # ConfigMap/Secret don't exist yet, so this must wait until after they're
    # created. pre-upgrade: on every subsequent upgrade those already exist
    # from the prior install, so migrate the schema before new pods roll out.
    #
    # Argo CD note: Argo CD maps both pre-install and pre-upgrade onto the
    # same PreSync phase and cannot tell an install from an upgrade, so this
    # combination isn't expressible there - it would fire as PreSync on a
    # fresh sync too, before those resources exist. Set dbInit.annotations
    # with an explicit "argocd.argoproj.io/hook: PostSync" (which takes
    # priority over helm.sh/hook) to get single, always-safe PostSync timing
    # under Argo CD instead.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.dbInit.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "netdisco.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-init
      annotations:
        {{- include "netdisco.vaultAnnotations" . | nindent 8 }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-pre-populate-only: "true"
        {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "netdisco.serviceAccountName" . }}
      securityContext:
        {{- include "netdisco.securityContext" . | nindent 8 }}
      {{- if include "netdisco.credentialsEnabled" . }}
      initContainers:
        {{- include "netdisco.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-backend"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /home/netdisco/bin/netdisco-env
            - /home/netdisco/bin/netdisco-updatedb.sh
          env:
            {{- include "netdisco.env" . | nindent 12 }}
            {{- with .Values.backend.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "netdisco.volumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dbInit.resources | nindent 12 }}
      volumes:
        {{- include "netdisco.volumes" . | nindent 8 }}
